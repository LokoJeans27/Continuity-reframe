<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img">
<title>Camera intention | selector reference</title>
<rect width="1200" height="540" rx="24" fill="#131d29"/>
<text x="48" y="65" fill="#eef5ff" font-family="sans-serif" font-size="32">Camera intention | selector reference</text>
<text x="48" y="103" fill="#a8bdce" font-family="sans-serif" font-size="18">Conceptual overview of existing controls. This is a diagram, not a browser screenshot.</text>
<rect x="48" y="145" width="350" height="145" rx="14" fill="#223449" stroke="#4e708c"/>
<text x="66" y="179" fill="#a9efd0" font-family="sans-serif" font-size="21">Quick views</text>
<text x="66" y="215" fill="#eef5ff" font-family="sans-serif" font-size="17">Front / three-quarter / lateral</text>
<text x="66" y="246" fill="#c5d4e1" font-family="sans-serif" font-size="16">Wide / overhead / low / rear</text>
<rect x="423" y="145" width="350" height="145" rx="14" fill="#223449" stroke="#4e708c"/>
<text x="441" y="179" fill="#a9efd0" font-family="sans-serif" font-size="21">Azimuth</text>
<text x="441" y="215" fill="#eef5ff" font-family="sans-serif" font-size="17">Range: -180 to +180 degrees</text>
<text x="441" y="246" fill="#c5d4e1" font-family="sans-serif" font-size="16">Approximate instruction to the model</text>
<rect x="798" y="145" width="350" height="145" rx="14" fill="#223449" stroke="#4e708c"/>
<text x="816" y="179" fill="#a9efd0" font-family="sans-serif" font-size="21">Elevation</text>
<text x="816" y="215" fill="#eef5ff" font-family="sans-serif" font-size="17">Range: -60 to +90 degrees</text>
<text x="816" y="246" fill="#c5d4e1" font-family="sans-serif" font-size="16">Positive values look downward</text>
<rect x="48" y="320" width="350" height="145" rx="14" fill="#223449" stroke="#4e708c"/>
<text x="66" y="354" fill="#a9efd0" font-family="sans-serif" font-size="21">Relative distance</text>
<text x="66" y="390" fill="#eef5ff" font-family="sans-serif" font-size="17">Range: 0.5 to 3</text>
<text x="66" y="421" fill="#c5d4e1" font-family="sans-serif" font-size="16">Framing intention, not meters</text>
<rect x="423" y="320" width="350" height="145" rx="14" fill="#223449" stroke="#4e708c"/>
<text x="441" y="354" fill="#a9efd0" font-family="sans-serif" font-size="21">Editable instruction</text>
<text x="441" y="390" fill="#eef5ff" font-family="sans-serif" font-size="17">Manual edits are preserved</text>
<text x="441" y="421" fill="#c5d4e1" font-family="sans-serif" font-size="16">Explicit regeneration replaces text</text>
<rect x="798" y="320" width="350" height="145" rx="14" fill="#223449" stroke="#4e708c"/>
<text x="816" y="354" fill="#a9efd0" font-family="sans-serif" font-size="21">Export and review</text>
<text x="816" y="390" fill="#eef5ff" font-family="sans-serif" font-size="17">Save a new scene JSON</text>
<text x="816" y="421" fill="#c5d4e1" font-family="sans-serif" font-size="16">Visibility and review flags reset</text>
</svg>